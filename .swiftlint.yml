# SwiftLint for the on-device agent.
#
# ⚠️ Added in milestone 03. Before this file, `swiftlint` ran with stock
# defaults over the whole repo — including `agent/.build/`, which is generated,
# and `tools/verify/`, which is throwaway probes. It reported 67 errors on code
# nobody wrote by hand, so `/devkit-lint`'s Swift half was a gate that could
# never go green and was therefore never read. A check that always fails is
# indistinguishable from no check.

included:
  - agent/Sources
  - agent/Tests

excluded:
  # Generated: SwiftPM's test runner shim and every build product.
  - agent/.build
  # POC probes. Deliberately scrappy, deliberately not shipped — see
  # `tools/verify/README.md`.
  - tools/verify

disabled_rules:
  # Fights `enum Foo { struct Bar { enum CodingKeys } }`, which is exactly how
  # the wire types mirror the contract's nesting. The nesting IS the schema.
  - nesting
  - todo

identifier_name:
  # `t0`, `ny`, `kid`, `x` are all right in their contexts: two of them are
  # JWK member names fixed by RFC 7517 and not ours to rename.
  min_length: 1
  excluded: [id]

type_name:
  min_length: 3

line_length:
  warning: 100
  error: 120
  ignores_comments: false
  ignores_urls: true

function_body_length:
  warning: 80
  error: 140

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800

cyclomatic_complexity:
  warning: 15
  error: 25

opt_in_rules:
  - force_unwrapping
  - empty_count
  - closure_spacing

# ⚠️ `force_unwrapping` and `force_try` are WARNINGS, not errors.
#
# Almost every occurrence is a test fixture decoding a policy literal that is
# right there in the file. A fixture that fails to decode should crash the test
# loudly; catching it would produce an EMPTY policy, and a predicate handed an
# empty policy answers "not restricted" — a green test proving nothing about a
# Mac that never locks. The failure mode of the lint rule is worse than the
# failure mode of the code.
force_unwrapping:
  severity: warning
force_try:
  severity: warning
